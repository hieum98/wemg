llm:
  model_name: "Qwen3-8B"
  url: "http://n0385:4000/v1"
  api_key: null
  client_type: "openai"
  concurrency: 64
  max_retries: 3
  generation:
    timeout: 300
    temperature: 0.8
    n: 1
    top_p: 0.8
    max_tokens: 32768
    max_input_tokens: 65536
    top_k: 20
    enable_thinking: true
    random_seed: 8888

cache:
  enabled: true
  host: "localhost"
  port: 6379
  db: 0
  password: null
  prefix: "wemg"
  ttl: 86400

retriever:
  type: "corpus"
  web_search:
    api_key: null
    top_k: 5
    crawl_full_text: true
    max_crawl_requests_per_second: 2
  corpus:
    embedder:
      model_name: "Qwen3-Embedding-4B"
      url: "http://n0385:4000/v1"
      api_key: null
      embedder_type: "openai"
    corpus_path: "Hieuman/wiki23-processed"
    index_path: "/home/hieum/uonlp/wemg/retriever_corpora/Qwen3-4B-Emb-index.faiss"

reranker:
  enabled: true
  model_name: "Qwen3-Reranker-4B"
  url: "http://n0999:30002/v1"
  api_key: "EMPTY"
  top_k: 10
  concurrency: 32
  instruction: null

search:
  strategy: "mcts"
  mcts:
    num_iterations: 30
    max_tree_depth: 10
    max_simulation_depth: 5
    exploration_weight: 2.5
    use_golden_answer_for_reward: false
    early_termination:
      enabled: true
      min_iterations: 5
      high_confidence_threshold: 0.9
      convergence_patience: 5
      semantic_sufficiency_count: 3
  cot:
    max_depth: 10

node_generation:
  n: 1
  n_subquestions: 3
  top_k_websearch: 5
  top_k_entities: 5
  n_hops: 1
  entity_linking_method: "llm"
  rerank_kb_documents: true
  azure_endpoint: null
  azure_key: null

memory:
  working_memory:
    max_textual_memory_tokens: 16384
  interaction_memory:
    enabled: false
    scope: "question"
    log_dir: "./logs"
    save_to_file: false
    db_path: null
    collection_name: "interaction_memory"
    token_budget: 8192
    batch_size: 32
    batch_size_async: 100
    is_local_embedding_api: true
    embedding_model_name: "Qwen3-Embedding-4B"
    embedding_base_url: "http://n0385:4000/v1"
    embedding_api_key: null
    enable_embedding_cache: true
    cache_max_size: 10000

logging:
  level: "WARNING"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

output:
  include_reasoning: true
  include_concise_answer: true
  show_search_tree: true
  verbose: false
