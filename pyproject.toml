[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wemg"
version = "0.2.0"
description = "WEMG - When Embedding Models Meet Graph RAG"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Hieu Man", email = "hieum@uoregon.edu"}
]

dependencies = [
    "litellm>=1.79.1",
    "redis>=7.0.1",
    "hiredis>=3.3.0",
    "openai",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.14.0",
    "lxml>=6.0.0",
    "requests>=2.31.0",
    "duckduckgo-search>=7.2.0",
    "ddgs>=9.8.0",
    "wikibase-rest-api-client>=0.1.3",
    "mediawikiapi>=1.2.2",
    "sparqlwrapper>=2.0.0",
    "faiss-cpu==1.12.0",
    "datasets==4.4.1",
    "networkx>=3.6.1",
    "torch>=2.0.0",
    "chromadb==1.3.7",
    "scikit-learn==1.8.0",
    "sentence-transformers==5.2.0",
    "colorama==0.4.6",
    "matplotlib==3.10.8",
    "pyvis>=0.3.2",
    "tiktoken>=0.5.0",
    "tqdm>=4.66.0",
    "numpy",
    "anytree>=2.13.0",
    "langchain>=1.2.17",
    "langchain-openai>=1.2.1",
    "langchain-chroma>=1.1.0",
    "langchain-litellm>=0.6.4",
    "langchain-redis>=0.2.5",
    "python-dotenv>=1.0.1",
    "langgraph>=1.1.10",
    "ipykernel>=7.2.0",
    "langchain-community>=0.4.1",
    "httpx>=0.28.1",
    "pytest-asyncio>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.21.0",
    "python-dotenv>=1.0.0",
    "fakeredis>=2.20.0",
    "respx>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["wemg*", "langgraph_coe*"]
exclude = ["test*", "wemg_backup*"]

[tool.pytest.ini_options]
testpaths = ["tests", "langgraph_coe/tests"]
asyncio_mode = "auto"
# Always stream logging to the terminal during runs; INFO is the lowest standard level. (DEBUG is too verbose)
log_cli = true
log_cli_level = "WARNING"
log_level = "WARNING"
