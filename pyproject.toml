[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wemg"
version = "0.2.0"
description = "WEMG - When Embedding Models Meet Graph RAG"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Hieu Man", email = "hieum@uoregon.edu"}
]

dependencies = [
    "litellm>=1.79.1",
    "redis>=7.0.1",
    "hiredis>=3.3.0",
    "openai",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.14.0",
    "lxml>=6.0.0",
    "requests>=2.31.0",
    "duckduckgo-search>=7.2.0",
    "ddgs>=9.8.0",
    "wikibase-rest-api-client>=0.1.3",
    "mediawikiapi>=1.2.2",
    "sparqlwrapper>=2.0.0",
    "faiss-cpu==1.12.0",
    "datasets==4.4.1",
    "networkx>=3.6.1",
    "torch>=2.0.0",
    "chromadb==1.3.7",
    "scikit-learn==1.8.0",
    "sentence-transformers==5.2.0",
    "colorama==0.4.6",
    "matplotlib==3.10.8",
    "tiktoken>=0.5.0",
    "numpy",
    "anytree>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["wemg*"]
exclude = ["test*", "wemg_backup*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
