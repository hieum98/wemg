llm:
  model_name: "Qwen3.5-4B"
  url: "http://n0385:4000/v1"
  api_key: null
  client_type: "openai"
  concurrency: 64
  max_retries: 3
  generation:
    timeout: 300
    temperature: 1.0
    n: 1
    top_p: 0.95
    min_p: 0.0
    max_tokens: 65536
    max_input_tokens: 131072
    top_k: 20
    presence_penalty: 1.5
    repetition_penalty: 1.0
    enable_thinking: true
    random_seed: 8888

cache:
  enabled: true
  host: "localhost"
  port: 6379
  db: 0
  password: null
  prefix: "coe"
  ttl: 86400

retriever:
  type: "corpus"
  web_search:
    api_key: null
    top_k: 5
    crawl_full_text: true
    max_crawl_requests_per_second: 2
    query_cache_ttl: 3600  # seconds; null to disable, 0 for no expiry
    url_cache_ttl: 3600    # seconds; null to disable, 0 for no expiry
  corpus:
    embedder:
      model_name: "Qwen/Qwen3-Embedding-4B"
      url: "http://n0301:30000/v1"
      api_key: null
      embedder_type: "openai"
    corpus_path: "Hieuman/wiki23-processed"
    index_path: "/home/hieum/uonlp/coe/retriever_corpora/Qwen3-4B-Emb-index.faiss"

reranker:
  enabled: true
  model_name: "Qwen3-Reranker-4B"
  url: "http://n0997:30000/v1"
  api_key: "EMPTY"
  instruction: "Given a web search query, retrieve relevant passages that answer the query."
  top_k: 10
  concurrency: 32
  instruction: null

search:
  strategy: "cot"
  mcts:
    num_iterations: 20
    max_tree_depth: 10
    exploration_weight: 2.5
    max_simulation_depth: 5
    early_termination:
      enabled: true
      min_iterations: 5
      high_confidence_threshold: 0.9
      convergence_patience: 5
      semantic_sufficiency_count: 5
  cot:
    max_depth: 10

node_generation:
  n: 1
  n_subquestions: 3
  top_k_websearch: 5
  top_k_entities: 5
  n_hops: 2
  entity_linking_method: "llm"
  rerank_kb_documents: true
  triple_pruning_delta: 0.07
  triple_pruning_top_k: 128
  azure_endpoint: null
  azure_key: null
  kb_source: wikidata
  freebase_subgraph_cache: null
  freebase_sparql_url: "http://n0387:3001/sparql"
  freebase_qid_to_mid_map_path: /home/hieum/uonlp/coe/data/freebase/qid_to_mid.json
  freebase_qid_to_mid_candidates: 5

memory:
  working_memory:
    max_textual_memory_tokens: 16384
  interaction_memory:
    enabled: false
    scope: "question"
    log_dir: "./logs"
    save_to_file: false
    db_path: null
    collection_name: "interaction_memory"
    token_budget: 8192
    batch_size: 32
    batch_size_async: 100
    is_local_embedding_api: true
    embedding_model_name: "Qwen3-Embedding-4B"
    embedding_base_url: "http://n0385:4000/v1"
    embedding_api_key: null
    enable_embedding_cache: true
    cache_max_size: 10000

logging:
  level: "WARNING"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

output:
  include_reasoning: true
  include_concise_answer: true
  show_search_tree: true
  verbose: false
