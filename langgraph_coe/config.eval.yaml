# Evaluation configuration: same environment as config.smoke.yaml (Qwen3-32B on
# Bedrock, local QLever Wikidata, web search instead of the local corpus, no
# reranker) but with realistic search budgets rather than the smoke test's tiny ones.
#
# The plan arm is selected on the command line, not here, so one config serves all
# three:
#   A0  search.plan.enabled=false
#   A1  search.plan.enabled=true search.plan.replan_max=0   (log-only)
#   A2  search.plan.enabled=true search.plan.replan_max=2   (armed)
#
# Run with:
#   python -m langgraph_coe.scripts.smoke_test
# or point the evaluator at it:
#   COE_CONFIG=langgraph_coe/config.smoke.yaml python -m langgraph_coe.evaluation.evaluate ...
#
# Prerequisites:
#   * AWS credentials with Bedrock access + AWS_REGION (or AWS_REGION_NAME) set.
#     ``boto3`` must be installed — LiteLLM needs it to sign Bedrock requests.
#   * A reachable Wikidata SPARQL endpoint. ``wikidata.sparql_endpoint`` below
#     points at the local QEndpoint deployment (docs/deploy_local_wikidata-v2.md);
#     override with COE_SPARQL_ENDPOINT, or set it to null to fall back to the
#     public endpoint.
#   * No Serper key is needed: web_search falls back to DuckDuckGo.

llm:
  api_key: null
  tiers:
    # One model for every role. ``api_base`` MUST be null for Bedrock: LiteLLM
    # routes by model name there, and a non-null api_base makes it try to reach
    # that host instead of the provider endpoint.
    heavy: &bedrock_tier
      model_name: bedrock/qwen.qwen3-32b-v1:0
      api_base: null
      api_key: null
      temperature: 0.7
      # Qwen3-32B on Bedrock has a 32,768-token window covering input + output,
      # far tighter than the cluster's 100k. ``max_input_tokens`` is what the
      # input guard trims against, so it must reflect the real window — left at
      # 100k the guard never fires and the provider rejects the request.
      #
      # ``chars_per_token`` matters just as much, and must be set pessimistically:
      # it is a content-dependent estimate, so the safe value is the *densest*
      # tokenization the prompt mix produces, not the average. Measured here by
      # walking it down against real overflows: 3.0 (default) → 60k chars read as
      # 31k tokens; 2.0 → 48k chars still read as >28.7k tokens (≈1.67 actual for
      # crawled web text + Wikidata triples). 1.6 with a 20k ceiling gives a
      # 32k-char budget ≈ 21k real tokens, clear of the 32768-4096 input ceiling.
      max_tokens: 4096
      max_input_tokens: 20000
      chars_per_token: 1.6
      top_p: 0.95
      # SGLang-only sampling knobs (top_k / min_p / repetition_penalty) and the
      # thinking-budget logit processor are left unset: Bedrock ignores or
      # rejects them, and the custom processor requires an SGLang server.
      enable_thinking: false
      thinking_budget: null
      max_retries: 3
      timeout: 300
    medium: *bedrock_tier
    # Planning shares the Bedrock tier here; the point of a separate tier is the
    # hotter sampling, which config.yaml sets. One model for the smoke run.
    plan: *bedrock_tier
    light: *bedrock_tier
    classify: *bedrock_tier

  role_tiers:
    planner: plan
    subquestion_generator: heavy
    answer_generator: heavy
    self_corrector: heavy
    final_answer_synthesizer: heavy
    verifier: medium
    memory_consolidator: heavy
    extractor: medium
    named_entity_recognition: light
    relation_extraction: light
    open_ie: light
    triple_pruner: light
    question_rephraser: light
    reasoning_synthesizer: medium
    web_researcher: heavy
    evaluator: medium

# Web search replaces the local Wikipedia corpus as the document surface.
# No api_key → DuckDuckGo backend (see tools/web.init_web_search).
web_search:
  enabled: true
  api_key: null
  top_k: 3
  crawl_full_text: true
  max_crawl_requests_per_second: 2.0
  max_queries_per_agent: 2

# No local FAISS index / embedding server in this setup. ``corpus_search`` raises
# when its pipeline is uninitialised, so the fan-out must be gated off rather
# than left to fail per hop.
retriever:
  enabled: false

# No reranker server: identity slice instead of an SGLang rerank call.
reranker:
  enabled: false

wikidata:
  # Local QLever endpoint on this box: plain ``/``, NOT the ``/api/endpoint/sparql``
  # path the cluster's QEndpoint deployment uses (docs/deploy_local_wikidata-v2.md
  # describes that other engine). Start it with:
  #   cd /home/ubuntu/wikidata/qlever-truthy
  #   sg docker -c "/home/ubuntu/.local/bin/qlever start"
  # Override with COE_SPARQL_ENDPOINT, or set null for public Wikidata.
  sparql_endpoint: http://localhost:7001
  max_sparql_rps: 50.0
  max_wikipedia_rps: 2.0
  triple_cache_max_entries: 5000
  max_hops: 2
  # Stage-A triple pruning falls back to the LLM TRIPLE_PRUNER without a reranker.
  reranker_url: null
  reranker_model: null
  pruning_top_k: 64
  pruning_delta: 0.07

memory:
  max_textual_memory_tokens: 16384
  prune_batch_size: 16
  extractor_max_input_chars: 24000

cache:
  enabled: false

search:
  strategy: cot
  cot:
    # Enough hops for a 3-hop chain plus a replan, without letting a stuck question
    # burn the whole budget.
    max_depth: 4
    recursion_limit: 120
  mcts:
    num_iterations: 2
    min_iterations: 1
    exploration_weight: 2.5
    max_tree_depth: 4
    max_simulation_depth: 1
    final_answer_min_depth: 1
    high_confidence_threshold: 0.9
    convergence_patience: 3
    semantic_sufficiency_count: 3
    recursion_limit: 100
    branch_local_memory: true
  plan:
    enabled: true
    # Back to log-only, now on evidence rather than caution. Arming it (=2) fired on
    # 20 of 62 questions and the effect was isolated by splitting the run:
    #
    #   on the 20 that replanned      armed 10  |  log-only 9  |  no plan 9
    #   on the 42 that did not        armed 26  |  log-only 21 |  no plan 26
    #
    # So the whole 30→36 gain came from the subquestion-breadth fix, not from
    # replanning: +1 row on the 20 questions that actually replanned. And those
    # questions cost 2.55 hops / 8.95 subquestions against 1.24 / 3.02 for the rest,
    # plus up to 2 extra PLANNER calls. Some of that is selection — a question that
    # trips the contested test is harder — but the direction is unambiguous.
    #
    # The trigger itself is sound: it fires on genuinely ambiguous referents. That is
    # why revising the plan does not help — the ambiguity is in the world, not in the
    # plan, so no rewrite of what to ask resolves it.
    replan_max: 0
    # Refuse to replan on the last hop — a plan with no hops left to execute it is
    # pure cost. 1, not 2: with max_depth=4 a headroom of 1 blocks only hop 3
    # (13/55 of a1's signals), while 2 would also block hop 2 and discard 51% of
    # them — including questions that still had two hops left to act on the revision.
    replan_min_depth_headroom: 1
    # 3, not 2. Of intents that eventually closed, 93-95% closed within 3 attempts
    # but only 81-89% within 2, so a threshold of 2 marks 11% (a1) to 19% (d1) of
    # eventual closures as stalled while they were still working. The decisive
    # interaction is with the per-intent pooling cap: at most 2 subquestions per
    # intent per hop means a threshold of 2 can fire after a SINGLE hop, which is
    # one round of ordinary work, not a stall. 3 requires two hops of no progress.
    stall_after_attempts: 3
    # Measured floor (experiment E5, ``scripts/verifier_noise_floor.py``): rating the
    # same answer against the same context 5x at temperature 0.7 gives a mean spread
    # of 1.5 and a **max of 3.0** over 30 calls. So anything at or below 3.0 fires on
    # sampling noise alone. 4.0 clears the observed floor by a single point — thin,
    # and the true max over more samples is probably higher, so treat a fire near the
    # boundary as unproven rather than as evidence.
    memory_disagreement_threshold: 4.0
