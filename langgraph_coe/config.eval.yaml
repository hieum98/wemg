# Evaluation configuration: locally-served Qwen3 via SGLang, local QLever Wikidata,
# local FAISS corpus + reranker, and web search — with realistic search budgets rather
# than the smoke test's tiny ones.
#
# Run with:
#   python -m langgraph_coe.evaluation.evaluate --config langgraph_coe/config.eval.yaml \
#     dataset_name_or_path=./datasets/musique_depth.jsonl level_column=level \
#     output_path=./results/<name>
#
# See docs/RESULTS.md "Reproducing the numbers" for the arms behind the reported results,
# and why paired arms must run CONCURRENTLY and at most two at a time.
#
# Prerequisites — every one of these must be up, or the corresponding surface silently
# degrades to nothing:
#   * Three SGLang servers (Qwen3-8B/4B/1.7B). Start with ./setup/sglang_up.sh, verify
#     with ./setup/sglang_up.sh --check. They MUST be launched with
#     `--reasoning-parser qwen3`, otherwise the chain-of-thought is left inline in
#     `content` and every structured-output parse has to survive a reasoning trace
#     prepended to its JSON.
#   * A Wikidata SPARQL endpoint. ``wikidata.sparql_endpoint`` points at the local
#     QLever deployment; start/verify with ./setup/wikidata_up.sh (``status`` also checks
#     that the index still exists on the host). Override with COE_SPARQL_ENDPOINT, or set
#     null for public Wikidata.
#   * The FAISS corpus index at ``retriever.corpus.index_path`` and an embedding server
#     (see the retriever block for the RAM caveat — this is not a small file).
#   * A reranker server at ``reranker.url``.
#   * SearXNG for the web fallback: ./setup/searxng_up.sh
#
llm:
  api_key: null
  # ── tiers ─────────────────────────────────────────────────────────────────────
  tiers:
    # Roles that reason over retrieved evidence: subquestion_generator,
    # answer_generator, self_corrector, final_answer_synthesizer, web_researcher.
    heavy: &qwen8b
      model_name: openai/Qwen/Qwen3-8B
      api_base: http://localhost:30000/v1
      api_key: null
      temperature: 0.7
      max_tokens: 16384
      max_input_tokens: 30000
      chars_per_token: 2.0
      top_p: 0.95
      enable_thinking: true
      # Needs an SGLang server started with --enable-custom-logit-processor; left null so
      # the default launch works. Only bounds reasoning, never the payload.
      thinking_budget: null
      reasoning_effort: null  # Bedrock-only; inert on SGLang. Do not set here.
      max_retries: 3
      timeout: 300
    # Planning. Same model as heavy; a plan makes no claim about the world, so breadth is
    # the hedge rather than precision. Sampling is left identical to heavy here (config.yaml
    # runs it hotter for n=3 plan diversity) so this file changes one thing at a time.
    plan: *qwen8b
    consolidate:
      <<: *qwen8b
      enable_thinking: false
    medium:
      <<: *qwen8b
      model_name: openai/Qwen/Qwen3-4B
      api_base: http://localhost:30001/v1
      temperature: 0.4
      max_tokens: 4096
      enable_thinking: false
    light:
      <<: *qwen8b
      model_name: openai/Qwen/Qwen3-1.7B
      api_base: http://localhost:30002/v1
      temperature: 0.2
      max_tokens: 8192
      enable_thinking: false

  role_tiers:
    planner: plan
    subquestion_generator: heavy
    answer_generator: heavy
    self_corrector: heavy
    final_answer_synthesizer: heavy
    verifier: medium
    memory_consolidation: consolidate
    extractor: medium
    named_entity_recognition: light
    relation_extraction: light
    open_ie: light
    triple_pruner: light
    question_rephraser: light
    reasoning_synthesizer: medium
    web_researcher: heavy
    evaluator: medium

web_search:
  enabled: true
  api_key: null  # SERPER_API_KEY from the environment; drives the `builtin` slot
  top_k: 3
  crawl_full_text: true
  max_crawl_requests_per_second: 2.0
  max_queries_per_agent: 2
  providers:
    # Head of the chain, and in practice almost the whole of it: MediaWiki nearly
    # always returns something and the chain stops at the first non-empty provider,
    # so the providers below mostly do not run. That is deliberate for MuSiQue,
    # whose gold paragraphs are drawn from Wikipedia — this is the gold source, not
    # a fallback — and it returns ~4k chars/query against SearXNG's ~70k, which is
    # what matters when the binding constraint is the ~7.7-item memory budget rather
    # than corpus coverage. Cost: on compositional queries MediaWiki answers wrongly
    # and still stops the chain ("who founded the company that made the Model T"
    # returns A. T. Cross, no Ford), so SearXNG no longer covers that case.
    - wikipedia
    # Local container, unmetered. Now reached only when Wikipedia returns nothing.
    # Start it first anyway: ./setup/searxng_up.sh
    - searxng
    # Brave API: 2k queries/month free. Ahead of Serper because this bucket refills
    # monthly and Serper's does not.
    - brave
    # Serper: ~2.5k one-time free credits, never replenished. At the measured ~8
    # queries/question a 120-question sweep is ~960 calls, so this bucket is worth
    # ~2.5 sweeps in total — it is the last non-billed resort, not the primary.
    - builtin
    # Billed, and this account's free tier is already exhausted (HTTP 432). Kept at
    # the tail so it is only reachable if everything else is down at once.
    - tavily
  searxng_url: http://localhost:8080
  wikipedia_lang: en

retriever:
  enabled: true

# Reranker server, enabled: a real cross-encoder pass instead of the identity slice.
# ``reranker.url`` must be serving ``model_name``; when it is unreachable the rerank step
# degrades to lexical overlap, which is silent, so check it before a sweep.
reranker:
  enabled: true

wikidata:
  # Local QLever endpoint on this box: plain ``/``, NOT the ``/api/endpoint/sparql``
  # path the cluster's QEndpoint deployment uses (docs/deploy_local_wikidata-v2.md
  # describes that other engine). Start it with:
  #   cd /home/ubuntu/wikidata/qlever-truthy
  #   sg docker -c "/home/ubuntu/.local/bin/qlever start"
  # Override with COE_SPARQL_ENDPOINT, or set null for public Wikidata.
  sparql_endpoint: http://localhost:7001
  max_sparql_rps: 50.0
  max_wikipedia_rps: 2.0
  triple_cache_max_entries: 5000
  max_hops: 2
  # Stage-A triple pruning: with a reranker available, use it instead of falling back to
  # the LLM TRIPLE_PRUNER. This is the cheaper path — it replaces an LLM call per hop with
  # one cross-encoder batch — and must point at the same server as ``reranker.url``.
  # Set both to null to restore the LLM-pruner fallback.
  reranker_url: http://n0999:30002/v1
  reranker_model: Qwen3-Reranker-4B
  pruning_top_k: 64
  pruning_delta: 0.07

memory:
  max_textual_memory_tokens: 16384
  prune_batch_size: 16
  extractor_max_input_chars: 24000

cache:
  enabled: false

search:
  strategy: cot
  cot:
    # Enough hops for a 3-hop chain plus a replan, without letting a stuck question
    # burn the whole budget.
    max_depth: 4
    recursion_limit: 120
  mcts:
    num_iterations: 2
    min_iterations: 1
    exploration_weight: 2.5
    max_tree_depth: 4
    max_simulation_depth: 1
    final_answer_min_depth: 1
    high_confidence_threshold: 0.9
    convergence_patience: 3
    semantic_sufficiency_count: 3
    recursion_limit: 100
    branch_local_memory: true
  plan:
    enabled: true
    replan_max: 0
    replan_min_depth_headroom: 1
    stall_after_attempts: 3
    memory_disagreement_threshold: 4.0
