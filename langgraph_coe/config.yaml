# LangGraph CoE — loaded by LangGraphCoeConfig.from_yaml() and pytest (tests/langgraph_coe).
#
# Sensitive values: prefer API_KEY or OPENAI_API_KEY in the repo-root .env (see tests/helpers/bootstrap.load_test_env).

llm:
  api_key: null

wikidata:
  max_sparql_rps: 2.0
  max_wikipedia_rps: 10.0
  triple_cache_max_entries: 5000
  max_hops: 3
  # Leave null so integration tests exercise Wikidata-only paths (Stage A rerank skipped).
  reranker_url: null
  reranker_model: null
  pruning_top_k: 64
  pruning_delta: 0.05

# Web tool (``init_web_search`` / ``web_search``): Serper key optional; DDG fallback if null.
web_search:
  api_key: null
  top_k: 3
  crawl_full_text: false
  max_crawl_requests_per_second: 2.0

# Corpus tool (``init_retrieval_pipeline`` / ``corpus_search``): needs a local FAISS bundle + embedder HTTP API.
# Override path with env LANGGRAPH_CORPUS_INDEX_PATH when the default is not on this machine.
retriever:
  corpus:
    index_path: /home/hieum/uonlp/wemg/retriever_corpora/Qwen3-4B-Emb-index.faiss
    embedder:
      model_name: Qwen3-Embedding-4B
      url: http://n0385:4000/v1
      api_key: null

reranker:
  enabled: false
  model_name: Qwen3-Reranker-4B
  url: http://n0999:30002/v1
  api_key: null
  top_k: 5
