# LangGraph CoE — loaded by LangGraphCoeConfig.from_yaml() and pytest (tests/langgraph_coe).
#
# Sensitive values: prefer API_KEY or OPENAI_API_KEY in the repo-root .env (see tests/helpers/bootstrap.load_test_env).

llm:
  api_key: null
  # Tier definitions: edit model_name / temperature / max_tokens / enable_thinking
  # here instead of in config.py. Unspecified fields fall back to TierConfig
  # defaults (api_base http://n0142:4000/v1, max_input_tokens 65536, top_p 0.95,
  # max_retries 3, timeout 300).
  tiers:
    heavy:
      model_name: Qwen3-Next-80B-A3B-Thinking-FP8
      temperature: 0.7
      max_tokens: 8192
      enable_thinking: true
    medium:
      model_name: Qwen3-Next-80B-A3B-Thinking-FP8
      temperature: 0.4
      max_tokens: 4096
      enable_thinking: false
    light:
      model_name: Qwen3-32B-FP8
      temperature: 0.2
      max_tokens: 2048
      enable_thinking: false
    # Bounded-output classification roles (§3b): tiny fixed-shape outputs, no thinking.
    classify:
      model_name: Qwen3-32B-FP8
      temperature: 0.0
      max_tokens: 1024
      enable_thinking: false
  # Role → tier routing. Remap a role to a different tier here; unknown roles
  # fall back to "heavy".
  role_tiers:
    answer_generator: heavy
    self_corrector: heavy
    final_answer_synthesizer: heavy
    subquestion_generator: heavy
    reasoning_synthesizer: heavy
    memory_consolidation: medium
    relation_extraction: medium
    open_ie: medium
    verifier: medium
    evaluator: medium
    triple_pruner: classify
    named_entity_recognition: classify
    question_rephraser: classify
    web_researcher: light
    extractor: light
    kg_ner_agent: light
    kg_triple_search_agent: medium

# Working-memory limits (MemoryUpdateGraph + CoT extractor batching).
memory:
  max_textual_memory_tokens: 16384
  prune_batch_size: 16
  extractor_max_input_chars: 24000

wikidata:
  max_sparql_rps: 2.0
  max_wikipedia_rps: 10.0
  triple_cache_max_entries: 5000
  max_hops: 3
  # Leave null so integration tests exercise Wikidata-only paths (Stage A rerank skipped).
  reranker_url: null
  reranker_model: null
  pruning_top_k: 64
  pruning_delta: 0.05

# Web tool (``init_web_search`` / ``web_search``): Serper key optional; DDG fallback if null.
web_search:
  enabled: false  # paper parity: KG + corpus only. Set true to re-enable the web fan-out.
  api_key: null
  top_k: 3
  crawl_full_text: false
  max_crawl_requests_per_second: 2.0
  max_queries_per_agent: 2

# Corpus tool (``init_retrieval_pipeline`` / ``corpus_search``): local FAISS + embedder HTTP API.
# Two index layouts (auto-detected by presence of a ``.pkl`` sidecar):
#   1. LangChain bundle — ``<name>.faiss`` + ``<name>.pkl``
#   2. Raw HF-datasets index — bare ``<name>.faiss``; passage text from ``corpus_dataset``
# Override path with LANGGRAPH_CORPUS_INDEX_PATH (or SAR_CORPUS_INDEX_PATH).
retriever:
  corpus:
    index_path: /home/hieum/uonlp/wemg/retriever_corpora/Qwen3-4B-Emb-index.faiss
    search_k: 10
    # Raw-index layout only; override with LANGGRAPH_CORPUS_DATASET / SAR_CORPUS_DATASET.
    corpus_dataset: null
    corpus_split: train
    text_column: contents
    embedder:
      model_name: Qwen3-Embedding-4B
      url: http://n0385:4000/v1
      api_key: null

reranker:
  enabled: false
  model_name: Qwen3-Reranker-4B
  url: http://n0999:30002/v1
  api_key: null
  top_k: 5

# Search strategy (system.py picks MCTSGraph vs CoTGraph via `strategy`).
search:
  strategy: mcts            # "mcts" | "cot"
  cot:
    max_depth: 5            # CoT decomposition loop iterations before forced synthesis
    recursion_limit: 75     # LangGraph superstep budget per CoT run
  mcts:
    num_iterations: 15      # hard cap on MCTS iterations
    min_iterations: 3       # floor before any early-termination condition may fire
    exploration_weight: 2.0
    max_tree_depth: 10
    max_simulation_depth: 3 # per-rollout CoTGraph depth
    final_answer_min_depth: 2
    high_confidence_threshold: 0.9
    convergence_patience: 5
    semantic_sufficiency_count: 3
    recursion_limit: 150    # LangGraph superstep budget per MCTS run

cache:
  enabled: false
  redis:
    host: localhost
    port: 6379
    llm_db: 0
    wikidata_db: 1
  wikidata:
    entity_ttl: 2592000
    search_ttl: 604800
    triples_ttl: 604800
    enrich_ttl: 2592000
  web:
    ttl: 86400
